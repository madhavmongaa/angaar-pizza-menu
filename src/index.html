<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angaar Pizza Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef9f3;--card:#fff;--ink:#16302a;--mut:#56706a;--mint:#c4ecd9;--mint2:#1f8a66;--red:#d8412f;--line:#d3e9de;--veg:#1e9e4a;--non:#c62f2f;--wood:#e7d3b3;--onmint:#fff;--shadow:0 6px 20px rgba(20,60,45,.10)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--card:#17251f;--ink:#e9f5ef;--mut:#9db5ab;--mint:#1f4336;--mint2:#63d1a6;--line:#263b33;--wood:#3a2c20;--shadow:0 6px 20px rgba(0,0,0,.45);--onmint:#0f1a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a17;--card:#17251f;--ink:#e9f5ef;--mut:#9db5ab;--mint:#1f4336;--mint2:#63d1a6;--line:#263b33;--wood:#3a2c20;--shadow:0 6px 20px rgba(0,0,0,.45);--onmint:#0f1a17;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,"Noto Sans Devanagari",system-ui,sans-serif;padding-bottom:96px}
h1,h2,h3{font-family:"Baloo 2","Noto Sans Devanagari",sans-serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mint2);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.35rem;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:.8rem;color:var(--mut)}
.hb{min-width:44px;height:44px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800}
.tabs{max-width:1100px;margin:auto;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.tab{flex:1;height:46px;border-radius:14px;background:var(--mint);font-weight:800}
.tab[aria-selected=true]{background:var(--red);color:#fff}
main{max-width:1100px;margin:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:.9rem}
.pill[aria-pressed=true]{background:var(--mint2);border-color:var(--mint2);color:var(--onmint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card .pz{width:66%;margin:0 auto 4px}
.card h3{font-size:1.2rem;display:flex;align-items:center;gap:8px}
.desc{margin:0;color:var(--mut);font-size:.9rem;flex:1}
.mark{flex:none;width:16px;height:16px;border:2px solid var(--veg);border-radius:3px;display:inline-grid;place-items:center}
.mark::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--veg)}
.mark.n{border-color:var(--non)}.mark.n::after{background:var(--non)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-size:1.25rem;font-family:"Baloo 2",sans-serif}
.btn{min-height:44px;padding:8px 20px;border-radius:14px;background:var(--red);color:#fff;font-weight:800}
.btn.ghost{background:var(--mint);color:var(--ink)}
.btn.go{width:100%;display:block;min-height:54px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{display:grid;gap:4px;margin-bottom:12px;font-weight:700;font-size:.9rem}
.fld select,.fld textarea,.fld input{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.msg{margin:10px 0 0;font-size:.9rem;color:var(--mut);text-align:center}
.msg.err{color:var(--red);font-weight:700}
.tblno{display:inline-block;background:var(--red);color:#fff;border-radius:8px;padding:0 8px;margin-right:6px;font-weight:800}
.sold{position:relative}.sold .pz{filter:grayscale(1) opacity(.55)}
.oc{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.oc h3{font-size:1rem;display:flex;justify-content:space-between;gap:8px}
.oc ul{margin:6px 0;padding-left:18px;font-size:.9rem}
.steps{display:flex;gap:4px;margin:10px 0 4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--mint2)}
.stx{font-weight:800;color:var(--mint2)}
.oc.cx{opacity:.6}.oc.cx .stx{color:var(--red)}
.linkbtn{color:var(--red);font-weight:700;text-decoration:underline;min-height:40px}
@media(max-width:430px){#fsBtn{display:none}}
.callbar{max-width:1100px;margin:auto;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.callbar .pill{flex:1;min-height:40px;font-weight:800}
.xsec{margin-top:28px}
.xsec>h2{font-size:1.5rem;margin-bottom:6px}
.xsec h3{margin:16px 0 8px;font-size:1.1rem;color:var(--mut)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.xi{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.xi>div{flex:1;min-width:0}
.xi b{display:flex;align-items:center;gap:6px}
.xi p{margin:2px 0 0;font-size:.82rem;color:var(--mut)}
.xi .btn{min-height:40px;padding:6px 14px}
.xi.sold{opacity:.55}
.paybox{background:var(--mint);border-radius:16px;padding:12px 14px;margin-bottom:12px;text-align:center}
.paybox a{text-decoration:none;display:block}
.paybox small{display:block;margin-top:6px;color:var(--mut)}
.stars{display:flex;gap:4px;margin:6px 0}
.stars button{width:40px;height:40px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-size:1.3rem;line-height:1;color:var(--mut)}
.stars button.on{background:#f2c14e;border-color:#f2c14e;color:#5a3a00}
.rate textarea{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);margin:4px 0}
.okline{font-size:.9rem;font-weight:700;color:var(--mint2);margin:6px 0 0}

/* pizza */
.pz{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#e6b56c 0 60%,#d89a4c 86%,#b9742f 94%,#9a5c22 100%);box-shadow:0 8px 14px rgba(0,0,0,.22);transition:filter .8s}
.pz .sauce{position:absolute;inset:8.5%;border-radius:50%;background:var(--sauce,#c8321f);transition:background .5s;box-shadow:inset 0 0 8px rgba(0,0,0,.25)}
.pz .cheese{position:absolute;inset:11%;border-radius:50%;background:
 radial-gradient(circle at 28% 30%,#fff3c4 0 9%,transparent 19%),radial-gradient(circle at 68% 24%,#ffeeb0 0 8%,transparent 17%),
 radial-gradient(circle at 76% 64%,#fff3c4 0 10%,transparent 20%),radial-gradient(circle at 32% 74%,#ffeeb0 0 9%,transparent 18%),
 radial-gradient(circle at 52% 48%,#fff0b8 0 10%,transparent 21%),rgba(250,212,116,.7)}
.pz .tops{position:absolute;inset:0}
.pc{position:absolute;width:var(--w);transform:translate(-50%,-50%) rotate(var(--r)) scaleX(var(--f));filter:drop-shadow(1px 2px 1.5px rgba(0,0,0,.4))}
.pc.drop{animation:drop .6s cubic-bezier(.3,1.4,.5,1) backwards}
@keyframes drop{from{transform:translate(-50%,-150%) rotate(var(--r)) scaleX(var(--f)) scale(2);opacity:0}55%{opacity:1}}
.sh-disc{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28) 0 12%,transparent 30%),radial-gradient(circle,transparent 62%,rgba(0,0,0,.22) 100%),var(--c)}
.sh-ring{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,transparent 0 40%,var(--c) 44% 66%,transparent 70%)}
.sh-strip{aspect-ratio:4.2;border-radius:45%;background:linear-gradient(rgba(255,255,255,.3),transparent 55%),var(--c)}
.sh-cube{aspect-ratio:1;border-radius:20%;background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 55%,rgba(0,0,0,.18)),var(--c)}
.sh-leaf{aspect-ratio:1.6;border-radius:0 75% 0 75%;background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 50%,rgba(0,0,0,.2)),var(--c)}
.sh-dot{aspect-ratio:1;border-radius:50%;background:var(--c)}
.sh-crumb{aspect-ratio:1.2;border-radius:42% 58% 50% 46%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),transparent 50%),var(--c)}
.pz.baked{filter:saturate(1.2) brightness(.86) sepia(.28) contrast(1.08)}
.flame{position:absolute;inset:-12%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,196,60,.0) 40%,rgba(255,120,20,.75) 62%,rgba(255,60,0,0) 76%)}
.flame.go{animation:flame 1.4s ease-out}
@keyframes flame{15%{opacity:1;transform:scale(1.04)}45%{opacity:.7;transform:scale(.98)}70%{opacity:.9;transform:scale(1.06)}to{opacity:0;transform:scale(1.15)}}

/* photo layers */
img.pz{display:block;height:auto}
.pz.ph{background:none;box-shadow:none;border-radius:0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
.card .pz{cursor:zoom-in;transition:transform .3s}
.card .pz:hover{transform:scale(1.04) rotate(3deg)}
.pz.photo{background:none;box-shadow:none}
.pz.photo img.sauce{inset:0;width:100%;height:100%;background:none;box-shadow:none;border-radius:0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.pz.photo img.cheese{inset:0;width:100%;height:100%;background:none;border-radius:0;opacity:.82}
.pz.photo .tint{position:absolute;inset:13%;border-radius:50%;background:var(--sauce);mix-blend-mode:soft-light;opacity:.75;transition:background .5s}
img.pc{height:auto;-webkit-user-drag:none;user-select:none}

/* hover zoom */
#zoom{background:none;box-shadow:none;padding:0;border-radius:0;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;place-items:center;overflow:hidden}
#zoom[open]{display:grid}
#zoom::backdrop{background:rgba(8,20,16,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.zwrap{position:relative;display:grid;justify-items:center;gap:14px;padding:16px}
.zstage{position:relative;width:min(74vw,52dvh);aspect-ratio:1}
.zspin{position:absolute;inset:0;animation:spin 70s linear infinite}
.zspin .pz{width:100%;cursor:default}
.zspin .tops{position:absolute;inset:0}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid #f2c14e;opacity:0;pointer-events:none}
.ring.go{animation:ring 1.1s ease-out both}
@keyframes ring{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.5)}}
@keyframes spin{to{transform:rotate(360deg)}}
.zinfo{background:var(--card);border-radius:20px;padding:14px 18px;width:min(92vw,380px);box-shadow:var(--shadow)}
.zinfo p{margin:4px 0 10px;color:var(--mut);font-size:.92rem}
.zinfo.up{animation:up .45s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.zx{position:absolute;top:4px;right:4px;z-index:2}

/* full screen / TV fallback layout */
.tv .brand p,.tv .desc{display:none}
.tv main,.tv .bar,.tv .tabs{max-width:none}
.tv .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tv .card .pz{width:82%}

/* builder */
.build{display:grid;gap:16px}
.stage{position:sticky;top:122px;z-index:10;background:var(--bg);padding:6px 0 10px;text-align:center}
.board{width:min(64vw,300px);aspect-ratio:1;margin:auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--wood) 60%,color-mix(in srgb,var(--wood) 80%,#000) 100%);box-shadow:var(--shadow);position:relative}
.board .pz{width:var(--sz,84%);transition:width .5s cubic-bezier(.3,1.5,.5,1),filter .8s}
.total{font:800 1.5rem "Baloo 2",sans-serif;margin-top:6px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:grid;gap:14px}
.panel h3{font-size:1rem;margin-bottom:6px}
.hint{margin:0;color:var(--mut);font-size:.88rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tp{position:relative}
.chip{width:100%;min-height:52px;display:flex;align-items:center;gap:8px;text-align:left;padding:6px 34px 6px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:.86rem;font-weight:600;line-height:1.2;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chip small{display:block;color:var(--mut);font-weight:400}
.chip.on{border-color:var(--mint2);background:var(--mint)}
.smp{flex:none;width:34px;height:34px;display:grid;place-items:center;touch-action:none;cursor:grab}
.smp>*{width:var(--sw)}
.cnt{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center}
.minus{position:absolute;right:4px;top:50%;translate:0 -50%;width:30px;height:44px;font-size:1.3rem;font-weight:800;color:var(--red)}
.ghost-pc{position:fixed;z-index:99;width:54px;height:54px;margin:-27px 0 0 -27px;display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
.ghost-pc>*{width:var(--gw)}
@media(min-width:820px){.build{grid-template-columns:400px 1fr;align-items:start}.stage{top:130px}.board{width:360px}}

/* cart + dialogs */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cartbar button{width:100%;max-width:560px;margin:auto;display:flex;justify-content:space-between;min-height:54px;align-items:center;border-radius:18px;background:var(--red);color:#fff;font-weight:800;padding:0 20px;box-shadow:var(--shadow)}
dialog{border:0;border-radius:24px;padding:20px;width:min(94vw,460px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,20,16,.55);backdrop-filter:blur(3px)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{width:44px;height:44px;border-radius:50%;background:var(--mint);font-size:1.2rem;font-weight:800}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line>div:first-child{flex:1;min-width:0}
.line small{display:block;color:var(--mut);font-size:.8rem}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:40px;height:40px;border-radius:12px;background:var(--mint);font-weight:800;font-size:1.1rem}
.sum{display:flex;justify-content:space-between;font:800 1.3rem "Baloo 2",sans-serif;margin:14px 0}
#qrbox{background:#fff;padding:16px;border-radius:16px;display:grid;place-items:center}
#qrbox svg{width:100%;max-width:260px;height:auto}
.toast{position:fixed;left:50%;bottom:84px;translate:-50% 20px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;translate:-50% 0}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><h1 id="shop"></h1><p id="tag"></p></div>
    <button class="hb" id="langBtn" aria-label="Switch language"></button>
    <button class="hb" id="myBtn" hidden></button>
    <button class="hb" id="qrBtn">QR</button>
    <button class="hb" id="fsBtn">⛶</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabMenu" aria-selected="true"></button>
    <button class="tab" role="tab" id="tabBuild" aria-selected="false"></button>
  </div>
  <div class="callbar" id="callbar" hidden><button class="pill" id="callStaff"></button><button class="pill" id="askBill"></button></div>
</header>

<main>
  <section id="menuView">
    <div class="pills" id="filters" role="group"></div>
    <div class="grid" id="grid"></div>
    <div class="xsec"><h2 id="xH"></h2><div id="xList"></div></div>
  </section>

  <section id="buildView" class="build" hidden>
    <div class="stage">
      <div class="board" id="board">
        <div class="pz" id="bpz"><i class="sauce"></i><i class="cheese"></i><div class="tops"></div><i class="flame"></i></div>
      </div>
      <div class="total" id="bTotal" aria-live="polite"></div>
      <div class="acts">
        <button class="btn ghost" id="bakeBtn"></button>
        <button class="btn ghost" id="resetBtn"></button>
        <button class="btn" id="bAdd"></button>
      </div>
    </div>
    <div class="panel">
      <div><h3 id="hSize"></h3><div class="pills" id="bSizes"></div></div>
      <div><h3 id="hSauce"></h3><div class="pills" id="bSauces"></div></div>
      <p class="hint" id="hint"></p>
      <div id="bTops"></div>
    </div>
  </section>
</main>

<div class="cartbar" id="cartbar" hidden><button id="cartBtn"><span id="cbL"></span><span id="cbR"></span></button></div>

<dialog id="cartDlg" aria-labelledby="cartH">
  <div class="dh"><h2 id="cartH"></h2><button class="x" data-close aria-label="Close">×</button></div>
  <div id="lines"></div>
  <div class="sum"><span id="sumL"></span><span id="sumR"></span></div>
  <div class="pills" id="modeSel" role="group" hidden style="margin-bottom:12px"></div>
  <label class="fld" id="tblWrap" hidden><span id="tblL"></span><select id="tblSel"></select></label>
  <label class="fld" id="nameWrap" hidden><span id="nameL"></span><input id="cname" maxlength="40" autocomplete="name"></label>
  <label class="fld" id="phoneWrap"><span id="phoneL"></span><input id="cphone" type="tel" inputmode="numeric" maxlength="14" autocomplete="tel-national"></label>
  <p class="msg" id="loyHint" style="margin:-4px 0 12px"></p>
  <label class="fld"><span id="noteL"></span><textarea id="note" maxlength="200" rows="2"></textarea></label>
  <button class="btn go" id="orderBtn"></button>
  <p class="msg" id="ordMsg" role="status"></p>
</dialog>

<dialog id="myDlg" aria-labelledby="myH">
  <div class="dh"><h2 id="myH"></h2><button class="x" data-close aria-label="Close">×</button></div>
  <div id="myList"></div>
</dialog>

<dialog id="qrDlg" aria-labelledby="qrH">
  <div class="dh"><h2 id="qrH"></h2><button class="x" data-close aria-label="Close">×</button></div>
  <div id="qrbox"></div>
</dialog>

<dialog id="zoom" aria-labelledby="zName"><div class="zwrap" id="zwrap">
  <button class="x zx" data-close aria-label="Close">×</button>
  <div class="zstage" id="zstage"><i class="ring"></i><i class="ring"></i><div class="zspin" id="zspin"></div></div>
  <div class="zinfo" id="zinfo"><h2 id="zName"></h2><p id="zDesc"></p><div class="row"><b class="price" id="zPrice"></b><button class="btn" id="zAdd"></button></div></div>
</div></dialog>

<div class="toast" id="toast" role="status"></div>

<script id="data" type="application/json">
{

/* ---------- pizza drawing ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const hash=s=>[...s].reduce((h,c)=>Math.imul(h,31)+c.charCodeAt(0)|0,7);
// best-of-7: each new piece goes to the candidate spot farthest from existing pieces
function place(count,existing,rnd){
  const out=[];
  for(let i=0;i<count;i++){
    let best,bd=-1;
    for(let c=0;c<7;c++){
      const a=rnd()*6.283,d=Math.sqrt(rnd())*36,x=50+Math.cos(a)*d,y=50+Math.sin(a)*d;
      const near=Math.min(99,...existing.concat(out).map(p=>Math.hypot(p.x-x,p.y-y)));
      if(near>bd){bd=near;best={x,y}}
    }
    best.r=Math.round(rnd()*360);best.f=rnd()<.5?-1:1;out.push(best);
  }
  return out;
}
function shapeEl(tp){const e=document.createElement('span');e.className='sh-'+tp.shape;e.style.setProperty('--c',tp.color);return e}

function pieceNode(tp,rnd,w,unit,prop){

  const p=ps[Math.floor(rnd()*ps.length)],e=new Image();e.src=p.u;e.alt='';e.draggable=false;
  if(prop)e.style.setProperty(prop,(unit==='%'?SZ[tp.id]:w)*Math.min(1,p.a)+unit);return e;
}

/* ---------- hover zoom ---------- */
let hovT,noHover=null,zId=null,zHover=false;
function openZoom(p,src,byHover){
  const z=$('#zoom');if(z.open||document.querySelector('dialog[open]'))return;
  clearTimeout(hovT);
  const s=sel[p.id]||0,spin=$('#zspin'),stage=$('#zstage');
  const el=src.cloneNode(true);el.removeAttribute('tabindex');el.removeAttribute('role');
  const tops=document.createElement('div');tops.className='tops';spin.replaceChildren(el,tops);
  $('#zName').textContent=p['name_'+lang];$('#zDesc').textContent=p['desc_'+lang];
  $('#zPrice').textContent='₹'+price(p,s)+' · '+D.sizes[s][lang];
  $('#zAdd').textContent=t(isSold(p.id)?'soldout':'add');$('#zAdd').disabled=isSold(p.id);
  $('#zAdd').onclick=()=>{addCart({key:p.id+'|'+s,k:'pizza',id:p.id,en:p.name_en,hi:p.name_hi,size:s,price:price(p,s)});z.close()};
  zId=p.id;zHover=byHover;
  const a=src.getBoundingClientRect();
  z.showModal();
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches,b=stage.getBoundingClientRect();
  // FLIP: start the big pizza exactly where the card photo is, then let it fly to the centre
  if(!still)stage.animate([{transform:`translate(${a.left+a.width/2-b.left-b.width/2}px,${a.top+a.height/2-b.top-b.height/2}px) scale(${a.width/b.width}) rotate(-50deg)`},{transform:'none'}],{duration:520,easing:'cubic-bezier(.2,.9,.3,1.12)'});
  const ids=[...new Set(p.toppings)],per=Math.max(4,Math.round(12/ids.length)),pts=[],far=Math.max(innerWidth,innerHeight)*.8;let i=0;
  ids.forEach(id=>place(per,pts,Math.random).forEach(pt=>{
    pts.push(pt);const e=mkPiece(T[id],pt);tops.append(e);
    if(!still){
      const g=Math.random()*6.283,rest=`translate(-50%,-50%) rotate(${pt.r}deg) scaleX(${pt.f})`;
      e.animate([{transform:`translate(calc(-50% + ${Math.cos(g)*far}px),calc(-50% + ${Math.sin(g)*far}px)) rotate(${pt.r+540}deg) scale(3)`,opacity:0},{opacity:1,offset:.3},{transform:rest+' scale(1.18)',offset:.86},{transform:rest}],
        {duration:700,delay:480+i*55,easing:'cubic-bezier(.3,.9,.4,1)',fill:'backwards'});
    }
    i++;
  }));
  const done=still?0:480+i*55+450;
  stage.querySelectorAll('.ring').forEach((r,k)=>{r.classList.remove('go');void r.offsetWidth;if(!still){r.style.animationDelay=done+k*250+'ms';r.classList.add('go')}});
  const info=$('#zinfo');info.classList.remove('up');void info.offsetWidth;if(!still){info.style.animationDelay=done+'ms';info.classList.add('up')}
}
$('#zoom').addEventListener('close',()=>{noHover=zId;$('#zspin').replaceChildren()});
$('#zwrap').addEventListener('pointerleave',e=>{if(zHover&&e.pointerType==='mouse')$('#zoom').close()});

$('#orderBtn').onclick=async()=>{
  const take=MODE==='takeaway',table=take?0:(okTable()||+$('#tblSel').value);
  const name=$('#cname').value.trim().slice(0,40),raw=$('#cphone').value.trim(),ph=raw?phone10(raw):'';

  if(ph===null||(take&&!ph))return fail('needPhone',$('#cphone'));
  if(Date.now()-lastSend<20000)return fail('wait');
  const items=cart.map(c=>({n:c.en,s:c.size!=null?D.sizes[c.size].en:'',q:c.q,p:c.price,d:c.detail?c.detail.en:'',

  LIVE.sending=true;LIVE.msg='';LIVE.err=false;renderOrderBox();

    await Promise.race([APP.sendHook({type:take?'takeaway':'table',table,name,phone:ph,items,total:cartTotal(),note:$('#note').value.trim().slice(0,200)}),new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),15000))]);

function renderBuilder(){

function addTopping(id){
  const n=B.layers[id]||0;if(n>=MAX||isSold(id))return;
  B.layers[id]=n+1;bpz.classList.remove('baked');
  const tp=T[id];
  place(perLayer(tp),B.pieces,Math.random).forEach((p,i)=>{
    p.id=id;p.layer=n+1;B.pieces.push(p);
    const e=mkPiece(tp,p);e.classList.add('drop');e.style.animationDelay=i*45+'ms';e.dataset.k=id+'|'+(n+1);bTops.append(e);
  });
  renderBuilder();
}
function removeLayer(id){
  const n=B.layers[id];if(!n)return;
  B.pieces=B.pieces.filter(p=>!(p.id===id&&p.layer===n));
  bTops.querySelectorAll(`[data-k="${id}|${n}"]`).forEach(e=>e.remove());
  n>1?B.layers[id]=n-1:delete B.layers[id];renderBuilder();
}

  const chip=e.target.closest('.chip');if(!chip||e.button)return;
  const id=chip.dataset.id,x0=e.clientX,y0=e.clientY;let moved=false,ghost;
  const over=ev=>{const b=bpz.getBoundingClientRect();return Math.hypot(ev.clientX-(b.left+b.width/2),ev.clientY-(b.top+b.height/2))<b.width/2};
  const move=ev=>{
    if(!moved&&Math.hypot(ev.clientX-x0,ev.clientY-y0)<8)return;
    if(!moved){moved=true;ghost=document.createElement('div');ghost.className='ghost-pc';ghost.append(pieceNode(T[id],()=>0,54,'px','--gw'));document.body.append(ghost)}
    ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
  };
  const end=ev=>{
    removeEventListener('pointermove',move);removeEventListener('pointerup',end);removeEventListener('pointercancel',end);
    if(ghost)ghost.remove();
    if(ev.type==='pointerup'&&(!moved||over(ev)))addTopping(id);
  };
  addEventListener('pointermove',move);addEventListener('pointerup',end);addEventListener('pointercancel',end);
});

$('#fsBtn').onclick=async()=>{
  const d=document.documentElement,b=document.body;
  if(document.fullscreenElement)return document.exitFullscreen();
  if(b.classList.contains('tv'))return b.classList.remove('tv');           // leaving the fallback layout
  try{await (d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(e){}  // blocked (e.g. iPhone): the wide layout below still applies
  b.classList.add('tv');
};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('tv')});
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1400)}

$('#langBtn').onclick=()=>{lang=lang==='en'?'hi':'en';try{localStorage.setItem('lang',lang)}catch(e){}renderAll()};

<script type="module">
// Live link to the shop's database. If it cannot load (no internet, or a host that blocks it), the menu still works for browsing.
let fb,A,F;
try{
  fb=await import('./fb.js');
  [A,F]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]);
}catch(e){APP.offline();throw e}
const {auth,db}=fb;let shop,menu;
const push=()=>{if(shop!==undefined&&menu!==undefined)APP.live(shop,menu)};
F.onSnapshot(F.doc(db,'config','shop'),d=>{shop=d.data()||{open:false,tables:12};push()},e=>{console.error(e);APP.offline()});
F.onSnapshot(F.doc(db,'config','menu'),d=>{menu=d.data()||{};push()},e=>console.error(e));
let unsub=null;
A.onAuthStateChanged(auth,u=>{
  if(!u){A.signInAnonymously(auth).catch(e=>{console.error(e);APP.offline()});return}
  if(unsub)unsub();
  unsub=F.onSnapshot(F.query(F.collection(db,'orders'),F.where('uid','==',u.uid)),qs=>{
    const since=Date.now()-12*3600e3,ms=o=>o.createdAt?o.createdAt.toMillis():Infinity;
    APP.mine(qs.docs.map(d=>({id:d.id,no:d.id.slice(-4).toUpperCase(),...d.data({serverTimestamps:'estimate'})})).filter(o=>ms(o)>since).sort((a,b)=>ms(b)-ms(a)));
  },e=>console.error(e));
  // Each write also stamps limits/{uid}_kind; the rules refuse a second one within 20 seconds.
  const stamped=(kind,ref,data)=>{const b=F.writeBatch(db);b.set(F.doc(db,'limits',u.uid+'_'+kind),{last:F.serverTimestamp()});b.set(ref,data);return b.commit()};
  APP.sendHook=o=>stamped('order',F.doc(F.collection(db,'orders')),{...o,status:'new',paid:false,uid:u.uid,createdAt:F.serverTimestamp(),updatedAt:F.serverTimestamp()});
  APP.reqHook=(kind,table)=>stamped('req',F.doc(F.collection(db,'requests')),{kind,table,uid:u.uid,done:false,createdAt:F.serverTimestamp()});
  APP.cancelHook=id=>F.updateDoc(F.doc(db,'orders',id),{status:'cancelled',updatedAt:F.serverTimestamp()});
  APP.rateHook=(id,rating,comment)=>F.updateDoc(F.doc(db,'orders',id),{rating,comment,updatedAt:F.serverTimestamp()});
  APP.refresh();
});
</script>
